[package]
name = "deepseek_balance_cube"
version = "1.0.0"
edition = "2021"
build = "build.rs"
description = "DeepSeek 余额小方块 —— Rust / Win32 版"
license = "MIT"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Networking_WinHttp",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Time",
    "Win32_Storage_FileSystem",
] }
serde_json = "1"
rand = "0.9"

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
